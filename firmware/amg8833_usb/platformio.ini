; AMG8833 8x8 thermal camera streamed over the ESP32-S3 native USB port.
; Plug the port labelled "USB" (not "UART") into the host.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ; Native USB-Serial/JTAG controller: enumerates as a CDC serial port with no
    ; driver and keeps esptool auto-reset working over the same cable.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAMG_SDA_PIN=13
    -DAMG_SCL_PIN=14
