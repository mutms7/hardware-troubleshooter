; Sensor head: AMG8833 8x8 thermal camera and a VL53L0X/VL53L1X time-of-flight sensor,
; each on its own I2C bus, streamed over the ESP32-S3 native USB port.
; Plug the port labelled "USB" (not "UART") into the host.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    pololu/VL53L0X@1.3.1
    pololu/VL53L1X@1.3.1
build_flags =
    ; Native USB-Serial/JTAG controller: enumerates as a CDC serial port with no
    ; driver and keeps esptool auto-reset working over the same cable.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Each pair is one bus, listed SDA first as measured on the bench (2026-10-24). The
    ; firmware still tries both orders at boot, so a swapped cable keeps working.
    -DAMG_PIN_A=14
    -DAMG_PIN_B=13
    -DTOF_PIN_A=47
    -DTOF_PIN_B=48
