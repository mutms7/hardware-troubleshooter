# Example only. Replace both absolute paths before adding to Codex configuration.
[mcp_servers.hardware_troubleshooter]
command = "C:/absolute/path/hardware-troubleshooter/.venv/Scripts/python.exe"
args = ["C:/absolute/path/hardware-troubleshooter/run_mcp.py"]
tool_timeout_sec = 10

[mcp_servers.hardware_troubleshooter.env]
TH_BACKEND = "stub"
TH_JOURNAL = "C:/absolute/path/hardware-troubleshooter/data/mcp_operations.sqlite3"

# For a future hardware backend, set TH_OUTER_TIMEOUT_S and TH_CANCEL_GRACE_S
# to agreed values.
# Host tool_timeout_sec must exceed their combined window plus transport overhead.
