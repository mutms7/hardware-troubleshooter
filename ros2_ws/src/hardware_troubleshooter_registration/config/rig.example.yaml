# Per-rig registration config. Every value is unset; fill each one from a calibration
# or a measurement on the real bench. The node never substitutes defaults.

base_frame: null        # arm base TF frame; board -> base is looked up through TF

# Bench plane in the camera optical frame: points X on the bench satisfy n . X = d.
# n points from the camera toward the bench. Measure it, e.g. with a calibration
# target lying flat on the bench.
bench_plane:
  normal: null          # [nx, ny, nz]
  distance_m: null      # d

segmentation:
  board_is_brighter: null   # true if the board is brighter than the bench around it

thresholds:
  max_fit_residual_px: null      # acceptance: RMS edge-point distance to the fitted model outline
  move_translation_m: null       # board_moved when any corner moves more than this
  move_rotation_rad: null        # board_moved when the board rotates more than this
  tracking_loss_timeout_s: null  # tracking_lost after this long without a confirming frame
  feature_min_contrast: null     # 0-1 intensity contrast for the asymmetric feature to count

# Read only by the launch file when publish_extrinsic:=true. Leave it unset if
# another node already publishes base -> camera.
camera_extrinsic:
  camera_frame: null        # camera optical frame id, as in the image header
  translation_m: null       # [x, y, z] of the camera in base_frame
  rotation_xyzw: null       # [x, y, z, w] of the camera in base_frame
