# Per-board registration config. Every value is unset; the node reports
# status=unconfigured until each one is filled from the PCB file or a measurement.
#
# Board frame: metres, z out of the top face. For outline_source: kicad, it is the
# KiCad board coordinate system with x = X_mm / 1000 and y = -Y_mm / 1000, and the
# feature and target positions below must use that same frame.

board_id: null          # must match the registry's board identity
frame_id: null          # TF child frame; defaults to board_<board_id>
thickness_m: null       # measured PCB thickness; the outline is fitted on the top surface

outline_source: null    # "kicad" or "measured"
kicad_pcb: null         # path relative to this file, when outline_source is kicad
outline_m: null         # [[x, y], ...] polygon vertices, when outline_source is measured

# At least one feature that breaks the outline's symmetry: a mounting hole,
# connector or fiducial. If it can't single out one orientation, tracking stays invalid.
features: []
#  - name: mounting_hole_1
#    shape: circle            # circle (center_m, radius_m) or rect (center_m, size_m, angle_rad)
#    center_m: [null, null]
#    radius_m: null
#    expect: darker           # darker or brighter than the board's median intensity

# Debug overlay only. Positions come from the PCB file or the measured registry,
# never from the image.
overlay_targets: []
#  - name: TP1
#    position_m: [null, null]
