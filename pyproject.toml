[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware-troubleshooter"
version = "0.3.0"
description = "MCP boundary for a hardware measurement orchestrator"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.5,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
# Datasheet PDFs, and the Moss mirror of the search index (used when MOSS_PROJECT_ID and
# MOSS_PROJECT_KEY are set). Moss is a pre-release under the PolyForm Shield licence.
docs = ["pypdf>=5,<7", "inferedge-moss==1.0.0b19"]
# read_dmm: camera capture and the 7-segment display reader.
dmm = ["opencv-python-headless>=4.8,<5", "numpy"]

[project.scripts]
hardware-troubleshooter = "troubleshooter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshooter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
